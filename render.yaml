services:
  - type: web
    name: hr-policy-assistant-backend
    env: python
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: CHROMA_COLLECTION_NAME
        value: hr_policy_documents_minilm
      - key: FRONTEND_URL
        sync: false
